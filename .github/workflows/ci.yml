name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支连续推送时，取消上一次还在跑的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # mvnw 从 Windows 提交上来可能没有可执行位
      - name: Make wrapper executable
        run: chmod +x mvnw

      # 单元测试（Modulith 边界 + ArchUnit）+ 集成测试（Testcontainers）
      # GitHub 托管的 runner 自带 Docker，Testcontainers 可以直接跑
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7
