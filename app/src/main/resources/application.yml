spring:
  application:
    name: collabhub

  # JDK 21+ 的虚拟线程：Tomcat 每个请求跑在虚拟线程上，
  # 后面调 MinIO / 调模型 API 这类阻塞 IO 不用再纠结线程池大小
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:collabhub}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USER:collabhub}
    password: ${DB_PASSWORD:collabhub_dev_pwd}
    hikari:
      pool-name: collabhub-pool
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    # 每个模块把自己的迁移脚本放在 db/migration 下，Flyway 会扫描全部 classpath 位置
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never

app:
  version: 0.1.0-SNAPSHOT
  cors:
    allowed-origins: http://localhost:5173
  security:
    jwt:
      # 签名密钥。HS256 要求至少 256 位（32 字节），短了 JJWT 会直接抛异常。
      # 这里的默认值只用于本地开发；真实部署必须通过环境变量 JWT_SECRET 覆盖，
      # 否则拿到源码的人可以伪造任意用户的令牌。
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789}
      issuer: collabhub
      # access 15 分钟：短是为了被盗后损失有限；靠 refresh 续期保证体验
      access-ttl: PT15M
    login:
      # 连续失败 5 次锁定 15 分钟（FR-AUTH-003）
      max-failed-attempts: 5
      lock-duration: PT15M
      # refresh token 7 天。它是不透明随机串（不是 JWT），所以可以随时吊销
      refresh-ttl: P7D

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    # 日志里带上 traceId / spanId / requestId，排障时一键串起来
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"
  level:
    root: INFO
    com.collabhub: DEBUG
    org.flywaydb: INFO
